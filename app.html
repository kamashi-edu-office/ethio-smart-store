<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ኢትዮ-ስማርት ስቶር</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f0f2f5; color: #222; }
        .navbar { background: #006633; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .navbar h2 { margin: 0; font-size: 17px; }
        .tabs { display: flex; background: #004d26; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: none; color: #ccc; font-weight: bold; cursor: pointer; font-size: 14px; }
        .tab-btn.active { color: white; border-bottom: 3px solid #f0ad4e; background: rgba(255,255,255,0.1); }
        .container { max-width: 850px; margin: 15px auto; padding: 0 12px; }
        .card { background: white; padding: 18px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .hidden { display: none; }
        input, select { width: 100%; padding: 10px; margin: 6px 0 14px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
        .btn { background: #006633; color: white; border: none; padding: 12px; border-radius: 5px; font-size: 15px; font-weight: bold; cursor: pointer; width: 100%; }
        .btn-blue { background: #0275d8; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-green { background: #28a745; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-top: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f4f4f4; }
        .summary-box { display: flex; gap: 10px; margin-bottom: 15px; }
        .stat { flex: 1; background: #e6f4ea; padding: 12px; border-radius: 6px; text-align: center; }
        .stat h3 { margin: 0; color: #006633; font-size: 18px; }
        .stat p { margin: 5px 0 0; font-size: 12px; }
        #receipt-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .receipt-paper { background: white; width: 310px; padding: 20px; border-radius: 5px; }
        @media print {
            body * { visibility: hidden; }
            #receipt-modal, #receipt-modal *, .print-area, .print-area * { visibility: visible; }
            #receipt-modal { position: absolute; left: 0; top: 0; background: none; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>

<div class="navbar no-print">
    <h2>ኢትዮ-ስማርት ስቶር (Offline)</h2>
    <a href="index.html" style="color: #f0ad4e; text-decoration: none; font-size: 14px;">ወደ መግቢያ</a>
</div>

<div class="tabs no-print">
    <button type="button" class="tab-btn active" id="tab-biz" onclick="showTab('biz')">የንግድ ስራ (POS/ዱቤ)</button>
    <button type="button" class="tab-btn" id="tab-gov" onclick="showTab('gov')">የመንግስት መሂ እና ሞዴል</button>
</div>

<div class="container">
    <div id="biz-box">
        <div class="summary-box no-print">
            <div class="stat"><h3 id="cash-sum">0 ብር</h3><p>ጠቅላላ ሽያጭ (ጥሬ)</p></div>
            <div class="stat" style="background:#fff3cd;"><h3 id="credit-sum" style="color:#856404;">0 ብር</h3><p>ያልተከፈለ ዱቤ</p></div>
        </div>

        <div class="card no-print">
            <h3>አዲስ ሽያጭ / ዱቤ መመዝገቢያ</h3>
            <input type="text" id="shop-name" placeholder="የሱቅዎ ስም (ለደረሰኝ ማተሚያ)">
            <input type="text" id="item-name" placeholder="የእቃው ስም እና ዝርዝር">
            <input type="number" id="item-price" placeholder="ጠቅላላ ዋጋ (በብር)">
            <select id="pay-type">
                <option value="cash">በጥሬ ገንዘብ (Cash)</option>
                <option value="credit">በዱቤ (Credit)</option>
            </select>
            <input type="text" id="cust-name" placeholder="የደንበኛ ስም">
            <button type="button" class="btn" onclick="saveSale()">መዝግብ (Save)</button>
        </div>

        <div class="card">
            <h3>የሽያጭ እና የዱቤ ዝርዝር</h3>
            <table>
                <thead><tr><th>እቃ</th><th>ዋጋ</th><th>ሁኔታ / ደንበኛ</th><th class="no-print">ደረሰኝ</th></tr></thead>
                <tbody id="sales-list"></tbody>
            </table>
        </div>
    </div>

    <div id="gov-box" class="hidden">
        <div class="card no-print">
            <h3>የመንግስት ፋይናንስ (መሂ) እና ንብረት (ሞዴል)</h3>
            <select id="doc-type">
                <optgroup label="የገንዘብ ሰነዶች (መሂ 1 - 12)">
                    <option value="መሂ 1 (የገንዘብ መቀበያ)">መሂ 1 - የገንዘብ መቀበያ ደረሰኝ</option>
                    <option value="መሂ 2 (የዕለት ገቢ ማጠቃለያ)">መሂ 2 - የዕለት ገቢ ማጠቃለያ</option>
                    <option value="መሂ 6 (የገንዘብ መክፈያ ሰነድ)">መሂ 6 - የገንዘብ መክፈያ ሰነድ</option>
                    <option value="መሂ 7 (የውሎ አበል)">መሂ 7 - የውሎ አበል መጠየቂያ እና መፍቀጃ</option>
                    <option value="መሂ 12 (የቅድሚያ ክፍያ ማወራረጃ)">መሂ 12 - የቅድሚያ ክፍያ ማወራረጃ</option>
                </optgroup>
                <optgroup label="የንብረት ሰነዶች (ሞዴል 19 - 22)">
                    <option value="ሞዴል 19 (የንብረት ገቢ)">ሞዴል 19 - የንብረት ገቢ ደረሰኝ</option>
                    <option value="ሞዴል 20 (የንብረት መጠየቂያ)">ሞዴል 20 - የንብረት መጠየቂያ</option>
                    <option value="ሞዴል 21 (የንብረት መፍቀጃ)">ሞዴል 21 - የንብረት ወጪ መፍቀጃ</option>
                    <option value="ሞዴል 22 (የንብረት ወጪ)">ሞዴል 22 - የንብረት ወጪ ደረሰኝ</option>
                </optgroup>
            </select>
            <input type="text" id="office-name" placeholder="የመስሪያ ቤቱ ስም">
            <input type="text" id="doc-no" placeholder="የደረሰኝ / ሞዴል ቁጥር">
            <input type="text" id="gov-desc" placeholder="የገንዘቡ ምክንያት ወይም የንብረቱ አይነት">
            <input type="text" id="gov-qty" placeholder="የገንዘብ መጠን (በብር) ወይም የንብረት ብዛት">
            <input type="text" id="gov-person" placeholder="ባለሙያ / ተረካቢ ስም">
            <button type="button" class="btn" onclick="saveGov()">ሰነዱን አዘጋጅ</button>
        </div>

        <div class="card print-area">
            <h3 style="text-align:center; border-bottom:2px solid #000; padding-bottom:8px;">የመንግስት ፋይናንስ እና ንብረት መዝገብ</h3>
            <table>
                <thead><tr><th>ሰነድ / ቁጥር</th><th>መስሪያ ቤት</th><th>ዝርዝር</th><th>መጠን</th><th>ባለሙያ</th><th class="no-print">አትም</th></tr></thead>
                <tbody id="gov-list"></tbody>
            </table>
            <button type="button" class="btn no-print" style="background:#0275d8; margin-top:12px;" onclick="window.print()">ሙሉውን ሰንጠረዥ አትም</button>
        </div>
    </div>
</div>

<div id="receipt-modal">
    <div class="receipt-paper">
        <h3 id="r-title" style="text-align:center; margin:0; border-bottom:1px dashed #000; padding-bottom:8px;">ደረሰኝ</h3>
        <p id="r-date" style="text-align:center; font-size:12px;"></p>
        <div id="r-body" style="font-size:13px; line-height:1.7;"></div>
        <p style="text-align:center; border-top:1px dashed #000; padding-top:10px; margin-top:15px; font-size:12px;">ፊርማ፡ _______________</p>
        <div class="no-print" style="display:flex; gap:10px; margin-top:12px;">
            <button type="button" class="btn" style="background:#0275d8;" onclick="window.print()">አትም (Print)</button>
            <button type="button" class="btn" style="background:#dc3545;" onclick="document.getElementById('receipt-modal').style.display='none'">ዝጋ</button>
        </div>
    </div>
</div>

<script>
let salesData = JSON.parse(localStorage.getItem('ethio_sales') || '[]');
let govData = JSON.parse(localStorage.getItem('ethio_gov') || '[]');
document.getElementById('shop-name').value = localStorage.getItem('ethio_shop') || '';

function showTab(name) {
    document.getElementById('tab-biz').classList.remove('active');
    document.getElementById('tab-gov').classList.remove('active');
    if (name === 'biz') {
        document.getElementById('biz-box').classList.remove('hidden');
        document.getElementById('gov-box').classList.add('hidden');
        document.getElementById('tab-biz').classList.add('active');
    } else {
        document.getElementById('biz-box').classList.add('hidden');
        document.getElementById('gov-box').classList.remove('hidden');
        document.getElementById('tab-gov').classList.add('active');
    }
}

function saveSale() {
    let shop = document.getElementById('shop-name').value || 'ኢትዮ-ስማርት ሱቅ';
    localStorage.setItem('ethio_shop', shop);
    let item = document.getElementById('item-name').value;
    let price = parseFloat(document.getElementById('item-price').value);
    let type = document.getElementById('pay-type').value;
    let cust = document.getElementById('cust-name').value || 'ደንበኛ';
    if (!item || !price) { alert('እባክዎ የእቃውን ስም እና ዋጋ ያስገቡ!'); return; }
    salesData.unshift({ id: Date.now(), shop: shop, item: item, price: price, type: type, cust: cust, date: new Date().toLocaleDateString() });
    localStorage.setItem('ethio_sales', JSON.stringify(salesData));
    drawSales();
    document.getElementById('item-name').value = '';
    document.getElementById('item-price').value = '';
    document.getElementById('cust-name').value = '';
}

function payCredit(id) {
    for (let i = 0; i < salesData.length; i++) {
        if (salesData[i].id === id) { salesData[i].type = 'cash'; }
    }
    localStorage.setItem('ethio_sales', JSON.stringify(salesData));
    drawSales();
}

function printBiz(id) {
    let s = salesData.find(x => x.id === id);
    if (!s) return;
    document.getElementById('r-title').innerText = s.shop;
    document.getElementById('r-date').innerText = 'ቀን፡ ' + s.date;
    document.getElementById('r-body').innerHTML = '<b>ደንበኛ፡</b> ' + s.cust + '<br><b>እቃ፡</b> ' + s.item + '<br><b>ዋጋ፡</b> ' + s.price + ' ብር<br><b>ሁኔታ፡</b> ' + (s.type === 'cash' ? 'ተከፍሏል' : 'ዱቤ');
