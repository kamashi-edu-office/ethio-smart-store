<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ኢትዮ-ስማርት ስቶር</title>
<style>
body { font-family: sans-serif; margin: 0; background: #f0f2f5; }
.nav { background: #006633; color: #fff; padding: 14px; display: flex; justify-content: space-between; }
.tabs { display: flex; background: #004d26; }
.tbtn { flex: 1; padding: 12px; border: 0; background: none; color: #ccc; font-weight: bold; }
.tbtn.act { color: #fff; border-bottom: 3px solid #f0ad4e; background: rgba(255,255,255,0.1); }
.box { max-width: 800px; margin: 12px auto; padding: 0 12px; }
.card { background: #fff; padding: 15px; border-radius: 8px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
.hide { display: none; }
input, select { width: 100%; padding: 10px; margin: 5px 0 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
.btn { background: #006633; color: #fff; border: 0; padding: 12px; border-radius: 5px; font-weight: bold; width: 100%; }
.b-sm { background: #0275d8; color: #fff; border: 0; padding: 5px 8px; border-radius: 4px; font-size: 12px; }
.g-sm { background: #28a745; color: #fff; border: 0; padding: 5px 8px; border-radius: 4px; font-size: 12px; margin-top: 4px; }
table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
th, td { border: 1px solid #ddd; padding: 7px; text-align: left; }
.sum { display: flex; gap: 10px; margin-bottom: 12px; }
.st { flex: 1; background: #e6f4ea; padding: 10px; border-radius: 6px; text-align: center; }
#modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; }
.paper { background: #fff; width: 300px; padding: 18px; border-radius: 5px; }
@media print { body * { visibility: hidden; } #modal, #modal * { visibility: visible; } #modal { position: absolute; left: 0; top: 0; background: none; } .no-p { display: none !important; } }
</style>
</head>
<body>
<div class="nav no-p"><b>ኢትዮ-ስማርት ስቶር</b><a href="index.html" style="color:#f0ad4e;text-decoration:none;">መግቢያ</a></div>
<div class="tabs no-p">
<button type="button" class="tbtn act" id="tb1" onclick="go('b')">የንግድ ስራ (POS/ዱቤ)</button>
<button type="button" class="tbtn" id="tb2" onclick="go('g')">የመንግስት መሂ እና ሞዴል</button>
</div>
<div class="box">
<div id="sec-b">
<div class="sum no-p">
<div class="st"><b id="s-cash">0 ብር</b><br><small>ጥሬ ሽያጭ</small></div>
<div class="st" style="background:#fff3cd;"><b id="s-cred" style="color:#856404;">0 ብር</b><br><small>ያልተከፈለ ዱቤ</small></div>
</div>
<div class="card no-p">
<h4>አዲስ ሽያጭ / ዱቤ</h4>
<input id="shop" placeholder="የሱቅዎ ስም">
<input id="item" placeholder="የእቃው ስም እና ዝርዝር">
<input id="price" type="number" placeholder="ጠቅላላ ዋጋ (በብር)">
<select id="ptype"><option value="cash">በጥሬ ገንዘብ</option><option value="credit">በዱቤ (Credit)</option></select>
<input id="cust" placeholder="የደንበኛ ስም">
<button type="button" class="btn" onclick="addB()">መዝግብ (Save)</button>
</div>
<div class="card"><table><thead><tr><th>እቃ</th><th>ዋጋ</th><th>ሁኔታ</th><th class="no-p">ደረሰኝ</th></tr></thead><tbody id="list-b"></tbody></table></div>
</div>
<div id="sec-g" class="hide">
<div class="card no-p">
<h4>የመንግስት መሂ (1-12) እና ሞዴል (19-22)</h4>
<select id="dtype">
<option value="መሂ 1 (ገንዘብ መቀበያ)">መሂ 1 - የገንዘብ መቀበያ ደረሰኝ</option>
<option value="መሂ 6 (ገንዘብ መክፈያ)">መሂ 6 - የገንዘብ መክፈያ ሰነድ</option>
<option value="መሂ 7 (የውሎ አበል)">መሂ 7 - የውሎ አበል መጠየቂያ/መፍቀጃ</option>
<option value="መሂ 12 (ክፍያ ማወራረጃ)">መሂ 12 - የቅድሚያ ክፍያ ማወራረጃ</option>
<option value="ሞዴል 19 (ንብረት ገቢ)">ሞዴል 19 - የንብረት ገቢ ደረሰኝ</option>
<option value="ሞዴል 20 (ንብረት መጠየቂያ)">ሞዴል 20 - የንብረት መጠየቂያ</option>
<option value="ሞዴል 21 (ንብረት መፍቀጃ)">ሞዴል 21 - የንብረት ወጪ መፍቀጃ</option>
<option value="ሞዴል 22 (ንብረት ወጪ)">ሞዴል 22 - የንብረት ወጪ ደረሰኝ</option>
</select>
<input id="off" placeholder="የመስሪያ ቤቱ ስም">
<input id="dno" placeholder="የደረሰኝ / ሞዴል ቁጥር">
<input id="gdesc" placeholder="ምክንያት ወይም የንብረት አይነት">
<input id="gqty" placeholder="የገንዘብ መጠን ወይም የንብረት ብዛት">
<input id="gper" placeholder="ባለሙያ / ተረካቢ ስም">
<button type="button" class="btn" onclick="addG()">ሰነዱን አዘጋጅ</button>
</div>
<div class="card"><table><thead><tr><th>ሰነድ</th><th>መስሪያ ቤት</th><th>ዝርዝር</th><th>መጠን</th><th class="no-p">አትም</th></tr></thead><tbody id="list-g"></tbody></table></div>
</div>
</div>
<div id="modal"><div class="paper"><h3 id="rt" style="text-align:center;margin:0;border-bottom:1px dashed #000;"></h3><p id="rd" style="text-align:center;font-size:12px;"></p><div id="rb" style="font-size:13px;line-height:1.6;"></div><p style="text-align:center;border-top:1px dashed #000;margin-top:12px;font-size:12px;">ፊርማ፡ ___________</p><div class="no-p" style="display:flex;gap:8px;margin-top:10px;"><button class="btn" style="background:#0275d8;" onclick="window.print()">አትም</button><button class="btn" style="background:#dc3545;" onclick="document.getElementById('modal').style.display='none'">ዝጋ</button></div></div></div>
<script>
let sb=JSON.parse(localStorage.getItem('es_b')||'[]'), sg=JSON.parse(localStorage.getItem('es_g')||'[]');
document.getElementById('shop').value=localStorage.getItem('es_s')||'';
function go(x){
document.getElementById('tb1').className=x=='b'?'tbtn act':'tbtn';
document.getElementById('tb2').className=x=='g'?'tbtn act':'tbtn';
document.getElementById('sec-b').className=x=='b'?'':'hide';
document.getElementById('sec-g').className=x=='g'?'':'hide';
}
function addB(){
let sh=document.getElementById('shop').value||'ኢትዮ-ስማርት ሱቅ'; localStorage.setItem('es_s',sh);
let it=document.getElementById('item').value, pr=parseFloat(document.getElementById('price').value), pt=document.getElementById('ptype').value, cu=document.getElementById('cust').value||'ደንበኛ';
if(!it||!pr)return alert('እቃ እና ዋጋ ያስገቡ');
sb.unshift({id:Date.now(),sh,it,pr,pt,cu,dt:new Date().toLocaleDateString()});
localStorage.setItem('es_b',JSON.stringify(sb)); drawB();
document.getElementById('item').value=''; document.getElementById('price').value='';
}
function pay(id){ sb=sb.map(x=>x.id==id?{...x,pt:'cash'}:x); localStorage.setItem('es_b',JSON.stringify(sb)); drawB(); }
function prB(id){ let s=sb.find(x=>x.id==id); document.getElementById('rt').innerText=s.sh; document.getElementById('rd').innerText='ቀን: '+s.dt; document.getElementById('rb').innerHTML='ደንበኛ: '+s.cu+'<br>እቃ: '+s.it+'<br>ዋጋ: '+s.pr+' ብር<br>ሁኔታ: '+(s.pt=='cash'?'ተከፍሏል':'ዱቤ'); document.getElementById('modal').style.display='flex'; }
function drawB(){
let h='',c=0,cr=0;
sb.forEach(s=>{ if(s.pt=='cash')c+=s.pr; else cr+=s.pr; h+=`<tr><td>${s.it}</td><td>${s.pr}</td><td>${s.pt=='cash'?'ጥሬ':'<b>ዱቤ</b>'}<br><small>${s.cu}</small>${s.pt=='credit'?`<br><button class="g-sm no-p" onclick="pay(${s.id})">ተከፍሏል</button>`:''}</td><td class="no-p"><button class="b-sm" onclick="prB(${s.id})">አትም</button></td></tr>`; });
document.getElementById('list-b').innerHTML=h; document.getElementById('s-cash').innerText=c+' ብር'; document.getElementById('s-cred').innerText=cr+' ብር';
}
function addG(){
let dt=document.getElementById('dtype').value, of=document.getElementById('off').value, dn=document.getElementById('dno').value||'-', gd=document.getElementById('gdesc').value, gq=document.getElementById('gqty').value, gp=document.getElementById('gper').value;
if(!of||!gd||!gq)return alert('ሁሉንም ይሙሉ');
sg.unshift({id:Date.now(),dt,of,dn,gd,gq,gp,d:new Date().toLocaleDateString()});
localStorage.setItem('es_g',JSON.stringify(sg)); drawG();
document.getElementById('gdesc').value=''; document.getElementById('gqty').value='';
}
function prG(id){ let g=sg.find(x=>x.id==id); document.getElementById('rt').innerText=g.of; document.getElementById('rd').innerText=g.dt+' | ቁ: '+g.dn; document.getElementById('rb').innerHTML='ዝርዝር: '+g.gd+'<br>መጠን: '+g.gq+'<br>ባለሙያ: '+g.gp+'<br>ቀን: '+g.d; document.getElementById('modal').style.display='flex'; }
function drawG(){
let h=''; sg.forEach(g=>{ h+=`<tr><td><b>${g.dt}</b><br><small>${g.dn}</small></td><td>${g.of}</td><td>${g.gd}</td><td>${g.gq}</td><td class="no-p"><button class="b-sm" onclick="prG(${g.id})">አትም</button></td></tr>`; });
document.getElementById('list-g').innerHTML=h;
}
drawB(); drawG();
</script>
</body>
</html>
